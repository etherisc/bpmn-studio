name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ docs ]
  pull_request:
    branches: [ docs ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Verify pnpm installation
      run: |
        pnpm --version
        which pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build Process Editor App
      run: |
        pnpm run build
        echo "App built successfully"
      env:
        NODE_ENV: production

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        working-directory: ./docs

    - name: Build Jekyll Documentation
      run: |
        cd docs
        bundle exec jekyll build --destination ../_site
      env:
        JEKYLL_ENV: production

    - name: Copy App to Jekyll Site
      run: |
        mkdir -p _site/app
        cp -r dist/* _site/app/
        echo "App copied to _site/app/"
        ls -la _site/app/

    - name: Copy Examples to Jekyll Site
      run: |
        mkdir -p _site/examples
        cp -r examples/* _site/examples/
        echo "Examples copied to _site/examples/"
        ls -la _site/examples/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/docs'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
